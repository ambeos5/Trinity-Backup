# Klipper configuration - Tronxy X5SA-Pro 400
# Mainboard: BIGTREETECH SKR 1.4 Turbo (LPC1769)
# TRINITY
# Drivers: TMC2209
# Z2 uses E1 driver
# Probe: 5V inductive sensor
# Hotend: Volcano
#
# IMPORTANT:
# This is a hardware-specific starting configuration. Verify every pin,
# thermistor type, and probe signal with your actual wiring before enabling
# heaters or running motors.

[include mainsail.cfg]
[include timelapse.cfg]
[include adxl345.cfg]
[include KAMP_Settings.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_2EB0010DE284D7955B684762C62000F5-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

# X/Y are CoreXY. Verify motor directions during initial testing.
[stepper_x]
step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 39.58
endstop_pin: ^!P1.29
position_endstop: 0
position_min: 0
position_max: 410
homing_speed: 100

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.80
stealthchop_threshold: 0

[stepper_y]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 39.86
endstop_pin: ^!P1.28
position_endstop: 0
position_min: 0
position_max: 400
homing_speed: 100

[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 0.80
stealthchop_threshold: 0

[stepper_z]
step_pin: P0.22
dir_pin: !P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 400

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.80
stealthchop_threshold: 0

# Second Z motor on E1 driver.
[stepper_z1]
step_pin: P1.15
dir_pin: !P1.14
enable_pin: !P1.16
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: P1.1
run_current: 0.80
stealthchop_threshold: 0

# ============================================================
# DIRECT-DRIVE GENERIC BMG DUAL-GEAR EXTRUDER - MOTOR3 / E0
#
# BMG starting point:
#   rotation_distance: 22.6789511
#   gear_ratio: 50:17
#
# Calibrate rotation_distance after the printer is operational.
# ============================================================

[extruder]
step_pin: P2.13
dir_pin: P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750

max_extrude_cross_section: 5

heater_pin: P2.7
sensor_type: Generic 3950
sensor_pin: P0.24

control: pid
pid_Kp: 13.614
pid_Ki: 0.447
pid_Kd: 103.634

min_temp: 0
max_temp: 285

[tmc2209 extruder]
uart_pin: P1.4
run_current: 0.70
stealthchop_threshold: 0

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

# ============================================================
# HEATED BED
# ============================================================

[heater_bed]
heater_pin: P2.5
sensor_type: Generic 3950
sensor_pin: P0.25
control: pid
pid_Kp: 75.199
pid_Ki: 0.612
pid_Kd: 2309.538
min_temp: 0
max_temp: 120

[verify_heater heater_bed]
max_error: 120
check_gain_time: 120
hysteresis: 5
heating_gain: 2

# ============================================================
# INDUCTIVE Z PROBE - Z-MIN CONNECTOR
#
# Requested probe offset:
#   X = -35
#   Y = -3
#   Z = calibrated 2.400
#
# ^ enables the MCU pull-up.
# ! inverts the input, commonly used for NPN-NO/open-collector probes.
# VERIFY with QUERY_PROBE before homing.
# ============================================================
# 5V inductive probe connected to Z-MIN on the SKR 1.4 Turbo.
# Z-MIN = P1.27.

[probe]
pin: ^!P1.27
x_offset: -35
y_offset: -3
z_offset: 2.400
speed: 5
samples: 2
samples_result: average
sample_retract_dist: 2
samples_tolerance: 0.05
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 235,210
speed: 200
z_hop: 10
z_hop_speed: 5

# ============================================================
# BED MESH
#
# mesh_min/max are PROBE coordinates, not nozzle coordinates.
# Limits below keep the probe safely inside a 400x400 bed with
# the requested X=-35 / Y=-3 offset and Y probing limit of 370.
# ============================================================

[bed_mesh]
mesh_min: 50,50
mesh_max: 365,390
probe_count: 7,7
algorithm: bicubic

# ============================================================
# INDEPENDENT DUAL-Z GANTRY LEVELING
# ============================================================

[z_tilt]
z_positions:
    50,210
    350,210

points:
    50,210
    365,210

speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.01

#####################################################################
# FIMENT RUNOUT CODE
#####################################################################

[filament_switch_sensor filament_sensor]
pause_on_runout: True
switch_pin: ^!P1.26
runout_gcode:
    M117 Filament Runout
insert_gcode:
    M117 Filament Inserted

#####################################################################
# FANS
#####################################################################

[controller_fan stepper_fans]
pin: P2.4
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, extruder
fan_speed: 1.0
idle_timeout: 60
idle_speed: 0.0

[fan]
# Part cooling fan
pin: P2.3

[virtual_sdcard]
path: ~/printer_data/gcodes

[input_shaper]
#shaper_freq_x: 35
#shaper_freq_y: 35
shaper_type: mzv
shaper_freq_x: 39.8
shaper_freq_y: 29.0


#####################################################################
# MACROS
#####################################################################

[gcode_macro CALIBRATE_Z_OFFSET]
description: Calibrate probe Z offset
gcode:
    G28
    PROBE_CALIBRATE

[gcode_macro BED_MESH]
gcode:
    BED_MESH_CALIBRATE

[gcode_macro PARK_HEAD]
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600
        G90
        G1 X10 Y390 F6000
    {% endif %}
    
[gcode_macro LOAD_FILAMENT]
description: Load filament
gcode:
    M83
    G92 E0
    G1 E25 F300
    G1 E25 F300
    G1 E20 F150
    G92 E0


[gcode_macro UNLOAD_FILAMENT]
description: Unload filament
gcode:
    M83
    G92 E0
    G1 E5 F300
    G1 E-40 F600
    G1 E-40 F600
    G92 E0

# Motors remain enabled for the entire paused state, including long pauses.
# When not paused, heaters and motors turn off after 10 minutes of inactivity.
[idle_timeout]
timeout: 600
gcode:
    {% if printer.pause_resume.is_paused %}
        SET_IDLE_TIMEOUT TIMEOUT=3600
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

[gcode_macro PAUSE]
description: Pause print and park toolhead at back-left
rename_existing: PAUSE_BASE
gcode:
    # Save current print position/state
    SAVE_GCODE_STATE NAME=PAUSE_state

    # Call Klipper's original PAUSE
    PAUSE_BASE
    SET_IDLE_TIMEOUT TIMEOUT=3600

    # Retract only if hot enough
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-2 F1800
    {% endif %}

    # Raise Z and park only if printer is homed
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600
        G90

        # Back-left of 400x400 bed
        G1 X10 Y390 F6000
    {% endif %}

[gcode_macro RESUME]
description: Resume paused print
rename_existing: RESUME_BASE
gcode:
    # Prime filament if hot enough
    {% if printer.extruder.can_extrude %}
        M83
        G1 E2 F1800
    {% endif %}

    # Restore position and movement state
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100

    # Resume print
    RESUME_BASE
    SET_IDLE_TIMEOUT TIMEOUT=600

[gcode_macro CANCEL_PRINT]
description: Cancel print and park toolhead at back-left
rename_existing: CANCEL_PRINT_BASE
gcode:
    # Wait for current movement to finish
    M400

    # Retract filament if hot enough
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-2 F1800
    {% endif %}

    # Lift Z 10mm if homed
    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600
        G90
    {% endif %}

    # Park at back-left if X and Y are homed
    # X10 = left, Y390 = back on a 400x400 machine
    {% if "xy" in printer.toolhead.homed_axes %}
        G1 X10 Y390 F6000
    {% endif %}

    # Turn off hotend
    M104 S0

    # Turn off heated bed
    M140 S0

    # Turn off part cooling fan
    M106 S0

    # Clear pause state
    CLEAR_PAUSE
    SET_IDLE_TIMEOUT TIMEOUT=600

    # Cancel print
    CANCEL_PRINT_BASE
[display_status]


[gcode_macro START_PRINT]
description: Trinity start - heated Z tilt, KAMP adaptive mesh and line purge
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}

    # Disable filament sensor during startup and homing
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0

    # Absolute XYZ positioning
    G90

    # Relative extrusion
    M83

    # Start heating bed
    M140 S{BED_TEMP}

    # Preheat nozzle
    M104 S150

    # Home all axes
    G28

    # Wait for bed
    M190 S{BED_TEMP}

    # Level independent Z motors
    Z_TILT_ADJUST

    # Re-home Z
    G28 Z

    # Clear old mesh
    BED_MESH_CLEAR

    # KAMP adaptive mesh
    BED_MESH_CALIBRATE

    # Heat nozzle to printing temperature
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    # Reset extruder
    G92 E0

    # KAMP purge
    LINE_PURGE

    # Reset extruder
    G92 E0

    # Enable filament sensor for the actual print
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1

[gcode_macro END_PRINT]
description: End print and park toolhead at back-left
gcode:
    M400

    # Retract only when the hotend can extrude
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-2 F1800
    {% endif %}

    # Lift and park only when axes are homed
    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600
        G90
    {% endif %}

    {% if "xy" in printer.toolhead.homed_axes %}
        # Back-left on 400x400 bed
        G1 X10 Y390 F6000
    {% endif %}

    # Turn Filament Sensor Off
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0

    # Shut everything down
    M104 S0
    M140 S0
    M106 S0
    SET_IDLE_TIMEOUT TIMEOUT=600
    M84

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[gcode_macro CHANGE_BED_PLATE]
description: Lower bed to Z200 and center toolhead
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90
    G1 Z200 F1200
    G1 X200 Y200 F6000
    G1 X10 Y390 F6000

[gcode_macro ADXL_TEST]
description: Test ADXL345 accelerometer connection
gcode:
    ACCELEROMETER_QUERY

[gcode_macro ADXL_NOISE]
description: Check ADXL345 noise levels
gcode:
    MEASURE_AXES_NOISE

[gcode_macro AUTO_SHAPER]
description: Run automatic X and Y input shaper calibration
gcode:
    G28
    G1 X200 Y200 Z20 F6000
    SHAPER_CALIBRATE

[gcode_macro RINGING_TOWER]
description: Start ringing tower test during print
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO=0
    TUNING_TOWER COMMAND=SET_VELOCITY_LIMIT PARAMETER=ACCEL START=1500 STEP_DELTA=500 STEP_HEIGHT=5
    RESPOND MSG="Ringing Tower: 1500 accel +500 every 5mm"

[exclude_object]

