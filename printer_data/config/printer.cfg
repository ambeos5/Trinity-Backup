# Marvin.cfg
# Cartisan-style Cartesian printer - 400x400x400 mm
# Controller: BIGTREETECH SKR 1.4 Turbo (LPC1769)
# Drivers: TMC2209 UART
# Hotend: Volcano
# Extruder: Direct-drive generic BMG dual-gear
# Probe: Inductive probe connected to Z-MIN
# Dual independent Z stepper drivers
#
# IMPORTANT:
# 1. Verify motor directions before full homing.
# 2. Verify endstop logic with QUERY_ENDSTOPS before homing.
# 3. Calibrate PID, extruder rotation_distance, probe Z offset, and bed mesh.
# 4. This assumes the second Z motor is connected to the E1/MOTOR4 driver socket.
# 5. Probe Z offset is still a starting value and should be calibrated.

[include Marvin_timelapse.cfg]
[include KAMP_Settings.cfg]

#####################################################################
# MCU / PRINTER
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_18C00211E284D795A69B4762C42000F5-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

[pause_resume]

[respond]
#####################################################################
# X AXIS - MOTOR0
#####################################################################

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: ^P1.29
position_endstop: 0
position_min: 0
position_max: 400
homing_speed: 100
homing_retract_dist: 5
second_homing_speed: 10

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.800
interpolate: True
stealthchop_threshold: 0

#####################################################################
# Y AXIS - MOTOR1
#####################################################################

[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: ^P1.28
position_endstop: 0
position_min: 0
position_max: 400
homing_speed: 100
homing_retract_dist: 5
second_homing_speed: 10

[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 0.800
interpolate: True
stealthchop_threshold: 0

#####################################################################
# Z AXIS - MOTOR2
#####################################################################

[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 400
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.800
interpolate: True
stealthchop_threshold: 0

#####################################################################
# SECOND Z AXIS - E1 / MOTOR4
#####################################################################

[stepper_z1]
step_pin: P1.15
dir_pin: P1.14
enable_pin: !P1.16
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: P1.1
run_current: 0.800
interpolate: True
stealthchop_threshold: 0

#####################################################################
# DIRECT DRIVE GENERIC BMG - E0 / MOTOR3
#####################################################################

[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 22.24
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.24

control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: P1.4
run_current: 0.700
interpolate: True
stealthchop_threshold: 0

#####################################################################
# HEATED BED
#####################################################################

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25

control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182

min_temp: 0
max_temp: 130

#####################################################################
# INDUCTIVE Z PROBE - Z MIN PLUG
#####################################################################

[probe]
pin: ^!P1.27
x_offset: 35
y_offset: 0
#z_offset: -1.498
speed: 5
samples: 3
samples_result: median
sample_retract_dist: 3
samples_tolerance: 0.02
samples_tolerance_retries: 3

#####################################################################
# SAFE Z HOME
#####################################################################

[safe_z_home]
home_xy_position: 165,200
speed: 100
z_hop: 10
z_hop_speed: 5

#####################################################################
# DUAL Z INDEPENDENT GANTRY LEVELING
#####################################################################

[z_tilt]
z_positions:
    380,200
    20,200

points:
    5,200
    330,200

speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.01

#####################################################################
# BED MESH
#####################################################################

[bed_mesh]
speed: 120
horizontal_move_z: 8
mesh_min: 40,10
mesh_max: 370,370
probe_count: 7,7
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1.0
fade_end: 10.0

#####################################################################
# FILAMENT RUNOUT SENSOR - E0DET
#####################################################################

[filament_switch_sensor filament_runout]
switch_pin: ^!P1.26
pause_on_runout: True
runout_gcode:
    M117 Filament Runout
insert_gcode:
    M117 Filament Inserted

#####################################################################
# FANS
#####################################################################

[controller_fan stepper_fans]
pin: P2.4
stepper: stepper_x, stepper_y, stepper_z, stepper_z1
fan_speed: 1.0
idle_timeout: 60
idle_speed: 0.0

[fan]
pin: P2.3

#####################################################################
# RASPBERRY PI TEMPERATURE
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100


#####################################################################
# VIRTUAL SD CARD / DISPLAY STATUS
#####################################################################

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

#####################################################################
# PRINT CONTROL MACROS
#####################################################################

[gcode_macro PAUSE]
description: Pause print and park toolhead at back-left
rename_existing: PAUSE_BASE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state
    PAUSE_BASE

    {% if printer.extruder.can_extrude %}
        M83
        G1 E-2 F1800
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600
        G90
        G1 X10 Y390 F6000
    {% endif %}

[gcode_macro RESUME]
description: Resume paused print
rename_existing: RESUME_BASE
gcode:
    {% if printer.extruder.can_extrude %}
        M83
        G1 E2 F1800
    {% endif %}

    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
description: Cancel print and park toolhead at back-left
rename_existing: CANCEL_PRINT_BASE
gcode:
    M400

    {% if printer.extruder.can_extrude %}
        M83
        G1 E-2 F1800
    {% endif %}

    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600
        G90
    {% endif %}

    {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
        G1 X10 Y390 F6000
    {% endif %}

    M104 S0
    M140 S0
    M106 S0
    CLEAR_PAUSE
    CANCEL_PRINT_BASE

[gcode_macro START_PRINT]
description: Marvin start with Z tilt, KAMP adaptive mesh, and adaptive purge
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}

    G90
    M83

    # Start heating bed and preheat nozzle
    M140 S{BED_TEMP}
    M104 S150

    # Home all axes
    G28

    # Wait for bed to reach printing temperature
    M190 S{BED_TEMP}

    # Level dual Z motors
    Z_TILT_ADJUST

    # Re-home Z after Z tilt
    G28 Z

    # Clear old bed mesh
    BED_MESH_CLEAR

    # KAMP adaptive bed mesh
    BED_MESH_CALIBRATE

    # Heat nozzle to final printing temperature
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    # Reset extruder position
    G92 E0

    # KAMP adaptive purge line
    LINE_PURGE

    # Reset extruder for print
    G92 E0

[gcode_macro END_PRINT]
description: End print and park toolhead at back-left
gcode:
    M400

    {% if printer.extruder.can_extrude %}
        M83
        G1 E-2 F1800
    {% endif %}

    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600
        G90
    {% endif %}

    {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
        G1 X10 Y390 F6000
    {% endif %}

    M104 S0
    M140 S0
    M106 S0
    M84

#####################################################################
# UTILITY MACROS
#####################################################################

[gcode_macro CALIBRATE_Z_OFFSET]
description: Calibrate probe Z offset
gcode:
    G28
    PROBE_CALIBRATE

[gcode_macro Z_TILT_LEVEL]
description: Home and independently level the two Z motors
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z

[gcode_macro BED_PLATE_CHANGE]
description: Lower bed to Z200 for easy bed plate change
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90
    G1 Z200 F1200
    G1 Y390 F6000
    M400
    M117 Change Bed Plate

[gcode_macro BED_MESH]
description: Run bed mesh calibration
gcode:
    BED_MESH_CALIBRATE

[gcode_macro PARK_HEAD]
description: Park toolhead at back-right
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600
        G90
        G1 X390 Y390 F6000
    {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Load filament into Marvin's direct-drive BMG
gcode:
    {% if printer.extruder.can_extrude %}
        M83
        G92 E0
        G1 E50 F300
        G1 E20 F150
        G92 E0
        M117 Filament Loaded
    {% else %}
        RESPOND TYPE=error MSG="Hotend is not hot enough to load filament"
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from direct-drive BMG
gcode:
    {% if printer.extruder.can_extrude %}
        M83
        G92 E0
        G1 E5 F300
        G1 E-80 F600
        G92 E0
    {% else %}
        RESPOND TYPE=error MSG="Hotend is not hot enough to unload filament"
    {% endif %}

[gcode_macro ADXL_CALIBRATE]
description: Run complete ADXL345 input shaper calibration
gcode:
    # Home Marvin if needed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Move to center of 400x400 bed
    G90
    G1 Z50 F1200
    G1 X200 Y200 F6000
    M400

    # Verify ADXL345 communication
    ACCELEROMETER_QUERY

    # Measure sensor noise
    MEASURE_AXES_NOISE

    # Run Klipper input shaper calibration
    SHAPER_CALIBRATE

[gcode_macro RINGING_TOWER]
description: Marvin ringing tower acceleration test
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO=0
    TUNING_TOWER COMMAND=SET_VELOCITY_LIMIT PARAMETER=ACCEL START=500 STEP_DELTA=250 STEP_HEIGHT=5
    RESPOND MSG="Marvin Ringing Tower: 500 accel +250 every 5mm"

[exclude_object]

